<aside class="panel" id="sitePanel"><button class="size-toggle" id="panelSize" aria-controls="panelContent" aria-expanded="true">− 缩小面板</button><div id="panelContent"><div class="eyebrow">SITE EXPLORER <span>01 / 03</span></div><h1>走进你的<br>土地规划。</h1><p class="intro">从总体布局到林间道路，<br>在真实尺度下探索每一处空间。</p><div class="area-total"><strong>10.0<span>亩</span></strong><small>图上已标注分区面积合计<br>上部树阵面积未标注</small></div><div class="section-label">快速定位 <span>↗</span></div><button class="zone" data-view="home"><i class="dot home"></i><div>生活区<small>6 个集装箱 · C 字庭院</small></div><b>1.1 <span>亩</span></b></button><button class="zone" data-view="plant"><i class="dot plant"></i><div>槟榔种植区<small>种植布局 · 林间通道</small></div><b>3.0 <span>亩</span></b></button><button class="zone" data-view="reserve"><i class="dot reserve"></i><div>预留区<small>开放草地 · 未来发展</small></div><b>5.9 <span>亩</span></b></button><button class="zone" data-view="orchard"><i class="dot plant"></i><div>生活区果园<small>果树阵列 · 自由浏览</small></div><b>↗</b></button><button class="zone" data-view="pump"><i class="dot" style="background:#3885a0"></i><div>灌溉井与泵房<small>果园供水 · 滴灌管线</small></div><b>↗</b></button><button class="zone" data-view="power"><i class="dot" style="background:#9b8d55"></i><div>遮阴树与配电房<small>四棵遮阴树 · 供电路径</small></div><b>↗</b></button><button class="zone" data-view="parking"><i class="dot" style="background:#54726d"></i><div>车棚与临时车位<small>3 个车棚位 · 3 个临时位</small></div><b>↗</b></button><div class="divider"></div><div class="section-label">场景显示</div><label class="toggle">分区与道路标注<input id="labels" type="checkbox" checked><span></span></label><label class="toggle">用地边界<input id="boundary" type="checkbox" checked><span></span></label><label class="toggle">地下供电路径（示意）<input id="cables" type="checkbox" checked><span></span></label><label class="toggle">车棚顶盖<input id="carportRoof" type="checkbox" checked><span></span></label><div class="sun-control"><label for="sun">光照时段 <b id="sunText">午后</b></label><input id="sun" type="range" min="0" max="100" value="62"><div><span>清晨</span><span>正午</span><span>日落</span></div></div><button class="reference-btn" id="reference">▧ 查看原始规划图</button><button class="export-btn" id="export">↓ 导出三维模型 <small>GLB</small></button><p class="disclaimer">依据图像估算比例 / 平地假设<br>建筑、植被与材质为概念示意，非测绘成果。</p></div></aside>
